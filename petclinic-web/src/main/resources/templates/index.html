<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring PetClinic Portal</title>
  <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>

  <nav>

</html>
