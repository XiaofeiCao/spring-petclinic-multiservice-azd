<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetClinic Veterinarians</title>
  <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<header>
  <div><strong>Spring PetClinic</strong></div>
  <nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/owners}">Owners</a>
    <a th:href="@{/vets}">Veterinarians</a>
  </nav>
</header>
<main>
  <section class="card">
    <h2>Veterinarians</h2>
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Specialties</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="vet : ${vets}">
        <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
        <td>
          <span class="badge" th:if="${#lists.isEmpty(vet.specialties)}">general</span>
          <span class="badge" th:each="spec : ${vet.specialties}" th:text="${spec.name}"></span>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
