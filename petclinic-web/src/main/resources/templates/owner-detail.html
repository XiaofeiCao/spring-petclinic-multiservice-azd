<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Details</title>
  <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<header>
  <div><strong>Spring PetClinic</strong></div>
  <nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/owners}">Owners</a>
    <a th:href="@{/vets}">Veterinarians</a>
  </nav>
</header>
<main>
  <section class="card">
    <h2 th:text="${owner.firstName + ' ' + owner.lastName}">Owner Name</h2>
    <p><strong>Address:</strong> <span th:text="${owner.address}"></span></p>
    <p><strong>City:</strong> <span th:text="${owner.city}"></span></p>
    <p><strong>Telephone:</strong> <span th:text="${owner.telephone}"></span></p>
    <h3>Pets</h3>
    <ul>
      <li th:each="pet : ${owner.pets}" th:text="${pet.name + (pet.type != null ? ' (' + pet.type.name + ')' : '')}"></li>
    </ul>
    <a class="btn" th:href="@{/owners}">Back to Owners</a>
  </section>
</main>
</body>
</html>
