name: spring-petclinic-multiservice

requiredVersions:
  azd: ">=1.37.2"
  extensions:
    azure.springboot: ">=0.1.0"

infra:
  provider: bicep
  path: infra
  module: main

services:
  petclinic-rest:
    project: ./petclinic-rest
    language: java
    host: springbootapp
    module: services/petclinic-rest

  petclinic-web:
    project: ./petclinic-web
    language: java
    host: springbootapp
    module: services/petclinic-web
    uses:
      - petclinic-rest

